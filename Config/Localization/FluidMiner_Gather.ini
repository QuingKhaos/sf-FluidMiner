ModulesToPreload=FluidMiner
SourcePath=Mods/GameFeatures/FluidMiner/Content/Localization/FluidMiner
DestinationPath=Mods/GameFeatures/FluidMiner/Content/Localization/FluidMiner
ManifestName=FluidMiner.manifest
ArchiveName=FluidMiner.archive
NativeCulture=en
CulturesToGenerate=en

[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=%LOCPROJECTROOT%Mods/GameFeatures/FluidMiner/Source
